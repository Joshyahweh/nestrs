# The hickory ignores (RUSTSEC-2026-0118/-0119) were removed once mongodb 3.9.1
# pulled hickory-* 0.26.3; both advisories no longer match the lockfile.
#
# `rsa` via **`sqlx-mysql`** (nestrs-prisma optional SQLx backends): RUSTSEC-2023-0071 notes
# no fixed stable release for the Marvin findings in the 0.9 line; monitor **`rsa`** /
# **`sqlx`** releases.
#
# `crypto-bigint` 0.5.x via **`jsonwebtoken` → p256/p384 → elliptic-curve 0.13**:
# RUSTSEC-2026-0387 is fixed in crypto-bigint >=0.7.6, but elliptic-curve 0.13
# cannot take that line. jsonwebtoken 11 still pins p256/p384 0.13. Drop the
# ignore when those crates move to elliptic-curve 0.14+ / crypto-bigint 0.7+.
#
# `libsqlite3-sys` 0.30.1 via **`sqlx` / `sqlx-sqlite` 0.8.6** (RUSTSEC-2026-0459 /
# CVE-2026-119375, uninitialized memory from a mismatched WAL). `sqlx`'s `sqlite`
# feature enables `sqlx-sqlite/bundled`, so this workspace does compile the
# bundled SQLite. The patched crate line is >=0.39.0. `sqlx-sqlite` 0.8.6
# requires `^0.30.1`; the first release that allows 0.39+ is `sqlx` 0.9.1,
# which sets `rust-version = "1.94"`. `sea-orm` 1.1 is tied to SQLx 0.8, and
# `sea-orm` 2.0 also requires Rust 1.94. Both sit above the workspace MSRV of
# 1.89. Drop the ignore when that MSRV can move and SQLx/SeaORM can follow.
[advisories]
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0387",
    "RUSTSEC-2026-0459",
]
