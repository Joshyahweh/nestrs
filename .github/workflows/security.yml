name: security

on:
  pull_request:
  push:
    branches:
      - main
      - master
  # Catch advisory drift (new RustSec entries) even when nothing is pushed.
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit
