[workspace]
members = [
  "nestrs",
  "nestrs-core",
  "nestrs-macros",
  "nestrs-events",
  "nestrs-prisma",
  "nestrs-microservices",
  "nestrs-cqrs",
  "nestrs-ws",
  "nestrs-graphql",
  "nestrs-openapi",
  "nestrs-cli",
  "nestrs-mcp",
  "nestrs-oauth2",
  "nestrs-oauth2-macros",
  "nestrs-storage",
  "nestrs-security",
  "nestrs-throttle",
  "nestrs-health",
  "nestrs-mongodb",
  "nestrs-http",
  # nestrs-drizzle excluded from the workspace until upstream `drizzle-orm 0.36`
  # is published on crates.io. The crate directory stays on disk for re-introduction
  # once that dep resolves; see CHANGELOG and project-memory for the carve-out.
  "examples/hello-app",
  "examples/lab",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "1.2.0"
rust-version = "1.88"
repository = "https://github.com/Joshyahweh/nestrs"
# `homepage`, `documentation`, `readme`, and `description` are deliberately
# not set at workspace level: `homepage` would be redundant with `repository`,
# and every member crate defines its own crate-specific values (nightly cargo
# warns on redundant/unusued fields).

[workspace.dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }
argon2 = "0.5"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
