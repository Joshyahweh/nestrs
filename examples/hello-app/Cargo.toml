[package]
name = "hello-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
nestrs = { path = "../../nestrs", features = ["admin"] }
nestrs-prisma = { path = "../../nestrs-prisma", features = ["sqlx"] }
axum.workspace = true
tokio.workspace = true
serde = { version = "1", features = ["derive"] }
schemars = { version = "1", default-features = false }
# Must match nestrs's pin (0.20): two validator versions in one tree means
# two distinct `Validate` traits — `ValidatedBody<T>` bounds on 0.20 while
# the app's DTO derives 0.21, and the Handler impl fails to satisfy.
validator = { version = "0.20", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "macros", "sqlite", "any"] }
