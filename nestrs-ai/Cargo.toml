[package]
name = "nestrs-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
description = "LLM / agent module for nestrs — NestJS @nestjs/ai parity (AI SDK-style, OpenAI-compatible)."
keywords = ["ai", "llm", "agents", "nest"]
categories = ["web-programming", "api-bindings"]

[dependencies]
nestrs-core = { path = "../nestrs-core", version = "1.7.1" }
nestrs-resilience = { path = "../nestrs-resilience", version = "1.7.1" }
axum.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
schemars = "1"

[features]
default = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
