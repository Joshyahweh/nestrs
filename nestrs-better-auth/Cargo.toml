[package]
name = "nestrs-better-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
description = "Thin Better Auth adapter for nestrs — nest the better-auth.rs Axum router and guard session cookies."
keywords = ["auth", "session", "nest", "adapter", "axum"]
categories = ["authentication", "web-programming"]

[dependencies]
async-trait = "0.1"
axum.workspace = true
nestrs-core = { path = "../nestrs-core", version = "1.5.0" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
