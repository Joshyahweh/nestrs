[package]
# crates.io: `nestrs-cli` is taken by another owner; install with `cargo install nestrs-scaffold` (binary: `nestrs-cli`).
name = "nestrs-scaffold"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "CLI generator and scaffolding tooling for nestrs."
keywords = ["cli", "scaffold", "nest", "generator", "axum"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde_json = "1"
# Optional MCP server mount. A future `nestrs mcp` subcommand will
# re-export the `nestrs_mcp::NestrsMcpServer` here so the CLI can serve
# stdio/HTTP without spawning a subprocess. Stubbed (off by default) for
# now so existing CLI builds are unaffected.
nestrs-mcp = { path = "../nestrs-mcp", version = "0.5.2", optional = true }

[[bin]]
name = "nestrs-cli"
path = "src/main.rs"

[features]
default = []
mcp = ["dep:nestrs-mcp", "nestrs-mcp/admin"]
