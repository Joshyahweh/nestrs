[package]
name = "nestrs-graphql"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "GraphQL extension crate for nestrs."
keywords = ["graphql", "nest", "axum", "async", "api"]
categories = ["web-programming", "network-programming"]

[dependencies]
async-graphql = "=7.0.17"
async-graphql-derive = "=7.0.17"
async-graphql-parser = "=7.0.17"
async-graphql-value = "=7.0.17"
axum.workspace = true
nestrs-core = { version = "0.5.2", path = "../nestrs-core" }
serde_json = "1"
tokio.workspace = true

[features]
## Multi-transport extension: per-request ability + transaction lifetime +
## CASL-style outbound masking on GraphQL responses. The hook trait
## (`GqlHandlerHook`) lives in this crate and is implemented by
## `nestrs::graphql_authz::GqlDataContext` in the main `nestrs` crate.
## `nestrs-graphql` stays independent of `nestrs` (Cargo would reject
## the cycle) — the main crate provides the typed context that wires
## the hook up.
graphql-authz = []
## Batching loaders (`DataLoader` / `Loader` + the per-request
## `DataLoaderRegistry`). Enables async-graphql's own `dataloader` module;
## batch tasks spawn on tokio, so the runtime dep is pulled here.
dataloader = ["async-graphql/dataloader"]
## Lightweight federation gateway: stitches subgraph SDLs behind a single
## Axum handler, exposes `_service { sdl }` for introspection and `_entities`
## for cross-subgraph entity resolution. async-graphql 7 ships federation
## support natively (no Cargo feature needed); we gate the gateway behind
## its own flag so users without federation don't pay the SDL-parser cost
## or see `nestrs_graphql::federation::*` in their autocomplete. Pulls in
## `graphql-authz` because the per-request `GqlHandlerHook` is the hook
## surface for row-level predicates (Wave 3D) — entity resolvers need the
## hook's task-local scope to see the ambient Ability.
federation-gateway = ["graphql-authz"]
