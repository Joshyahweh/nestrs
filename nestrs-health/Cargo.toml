[package]
name = "nestrs-health"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
description = "Health probe (Terminus-style) building blocks for nestrs — liveness/readiness/startup decorators, indicator trait, and standard indicators (database, HTTP dependency, disk space, broker)."
keywords = ["health", "probe", "terminus", "liveness", "readiness"]
categories = ["api-bindings", "web-programming"]

[dependencies]
nestrs-core = { path = "../nestrs-core", version = "1.5.0" }
axum.workspace = true
tokio.workspace = true
async-trait = "0.1"
serde_json = "1"
tracing = "0.1"
# `ServiceExt::oneshot` is used by `install_probes` to mirror stamped handlers
# through the main router. Only the `util` feature is needed.
tower = { version = "0.5", features = ["util"] }
## HTTP dependency GET indicator (`HttpIndicator`). Same `reqwest` shape as the
## umbrella's outbound `HttpService` — feature-unifies with `nestrs`'s `reqwest`
## dep when both flags are on.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
## Disk-space indicator (`DiskSpaceIndicator`, unix only — backed by `statvfs`).
libc = { version = "0.2", optional = true }
## Redis `PING` broker readiness (`RedisBrokerHealth`).
redis = { version = "0.29", features = ["tokio-comp"], optional = true }
## NATS TCP connect readiness (`NatsBrokerHealth`).
async-nats = { version = "0.47", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = []
## HTTP dependency GET indicator (`HttpIndicator::new(url, timeout)`).
http = ["dep:reqwest"]
## Disk-space indicator (`DiskSpaceIndicator::new(path, min_free_bytes)`).
disk = ["dep:libc"]
## Redis `PING` broker readiness (`RedisBrokerHealth`).
redis = ["dep:redis"]
## NATS TCP connect readiness (`NatsBrokerHealth`).
nats = ["dep:async-nats"]
## Convenience: every indicator + broker above.
all = ["http", "disk", "redis", "nats"]
