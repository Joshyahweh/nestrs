[package]
name = "nestrs-idempotency"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
description = "Idempotency-Key middleware for nestrs — NestJS @nestjs/idempotency parity."
keywords = ["idempotency", "nest", "axum"]
categories = ["web-programming", "asynchronous"]

[dependencies]
nestrs-core = { path = "../nestrs-core", version = "1.7.0" }
axum.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
http-body-util = "0.1"
bytes = "1"
redis = { version = "0.29", default-features = false, features = ["tokio-comp"], optional = true }

[features]
default = []
cache-redis = ["dep:redis"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
