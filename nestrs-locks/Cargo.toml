[package]
name = "nestrs-locks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
description = "Distributed lease locks for nestrs — NestJS @nestjs/locks parity."
keywords = ["locks", "distributed", "nest"]
categories = ["asynchronous", "concurrency"]

[dependencies]
nestrs-core = { path = "../nestrs-core", version = "1.7.1" }
axum.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
redis = { version = "0.29", default-features = false, features = ["tokio-comp"], optional = true }

[features]
default = []
cache-redis = ["dep:redis"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
