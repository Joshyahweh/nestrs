[package]
name = "nestrs-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/nestrs-mcp"
description = "Model Context Protocol server for nestrs: project introspection, live runtime, scaffolding, and docs search."
keywords = ["mcp", "mcp-protocol", "introspection", "nest", "axum"]
categories = ["development-tools", "api-bindings"]

[lib]
# The library exposes the server so embedders (e.g. `nestrs-cli`) can mount it
# inside their own binary without spawning a subprocess. The MCP binary
# `nestrs-mcp` (below) is the canonical stdio/HTTP entry point.
path = "src/lib.rs"

[[bin]]
name = "nestrs-mcp"
path = "src/main.rs"

[dependencies]
nestrs-core = { path = "../nestrs-core", version = "1.3.0" }
nestrs = { path = "../nestrs", version = "1.3.0", optional = true }
# Pulled in only for the `authz` feature so the `McpDataContext` and the
# `call_tool` override can name `sqlx::AnyPool` directly. The main
# `nestrs` crate re-uses the same `sqlx` dep under its `database-sqlx`
# feature — duplicating it here keeps the cycle one-way
# (`nestrs-mcp -> nestrs`).
sqlx = { version = "0.8", optional = true }

# MCP SDK — stdio transport is the default (Claude Code, Cursor, VS Code).
# Streamable HTTP transport is gated behind the `http` feature for hosted use.
# The `elicitation` rmcp feature is also gated behind our own `elicitation`
# feature so users who don't need server→client questions don't pay for
# the `url` crate.
rmcp = { version = "3.1", default-features = false, features = [
    "server",
    "macros",
    "schemars",
    "transport-io",
] }
schemars = "1"
dashmap = "6"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
syn = { version = "2", features = ["full", "extra-traits", "parsing"] }
quote = "1"
proc-macro2 = "1"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
tempfile = "3"
toml = "0.8"
axum = { workspace = true }
# Cross-platform home-dir resolution for the `init`/`setup` wizard
# (e.g. `~/.cursor/mcp.json` on Unix, `%USERPROFILE%\.cursor\mcp.json` on Windows).
dirs = "5"

[dev-dependencies]
# Integration tests that spawn the binary need the same rmcp as the binary
# (so the test can speak the protocol to a child process).
rmcp = { version = "3.1", default-features = false, features = [
    "server",
    "client",
    "macros",
    "schemars",
    "transport-io",
] }
tokio = { version = "1", features = ["full", "process", "io-util", "macros", "rt-multi-thread"] }
# Live admin-port smoke test needs the `#[injectable]` / `#[module]`
# proc-macro attributes. The test itself is `#[cfg(feature = "admin")]`
# so the macro dep is unused when the feature is off — that's fine.
nestrs-macros = { path = "../nestrs-macros", version = "1.3.0" }
# `RouteRegistry::clear_for_tests` and friends — only used by the
# admin-port smoke test to make the route-registry state deterministic.
nestrs-core = { path = "../nestrs-core", version = "1.3.0", features = ["test-hooks"] }
# Multi-transport-scope integration tests build a `NestrsMcpServer` with
# `McpDataContext` and need the typed `Ability` + `mask_value` + sqlx
# helpers. Gated on the same `authz` feature the tests themselves
# require; without it the dev-dep is unused and clippy complains.
nestrs = { path = "../nestrs", version = "1.3.0", features = ["authz", "database-sqlx"] }

[features]
default = ["stdio"]
stdio = []
http = ["rmcp/transport-streamable-http-server"]
admin = ["dep:nestrs", "nestrs/admin"]
## Per-tool-call ambient ability + transaction + outbound masking on top of
## `NestrsMcpServer`. Mirrors the `ws-authz` and `graphql-authz` features in
## the main `nestrs` crate: opting in wires `McpDataContext`,
## `current_mcp_ability`, and `current_mcp_transaction` into the server and
## overrides `ServerHandler::call_tool` so every tool call runs inside the
## same task-local scopes that HTTP/WS/GraphQL use.
authz = ["dep:nestrs", "dep:sqlx", "nestrs/authz", "nestrs/database-sqlx"]
## Row-level authorization enforcement on top of `authz`: the pre-built
## predicates and the mandatory `CrudService` application. Mirrors the
## `authz-row-level` feature of the main crate so multi-transport tests can
## exercise the same seam the HTTP/WS/GraphQL transports use.
authz-row-level = ["authz", "nestrs/authz-row-level"]
## Server→client elicitation (SEP-1034). Enables the `McpSurfaces`
## `register_elicitation` builder, the `NestrsMcpServer::elicit`
## helper, and the rmcp `elicitation` feature (which adds the `url`
## crate for `ElicitRequestParams::Url*`). Tools that need to ask
## the user a question mid-flight opt in here.
elicitation = ["rmcp/elicitation"]
