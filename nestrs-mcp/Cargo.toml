[package]
name = "nestrs-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nestrs-mcp"
readme = "README.md"
description = "Model Context Protocol server for nestrs: project introspection, live runtime, scaffolding, and docs search."
keywords = ["mcp", "mcp-protocol", "introspection", "nest", "axum"]
categories = ["development-tools", "api-bindings"]

[lib]
# The library exposes the server so embedders (e.g. `nestrs-cli`) can mount it
# inside their own binary without spawning a subprocess. The MCP binary
# `nestrs-mcp` (below) is the canonical stdio/HTTP entry point.
path = "src/lib.rs"

[[bin]]
name = "nestrs-mcp"
path = "src/main.rs"

[dependencies]
nestrs-core = { path = "../nestrs-core", version = "0.5.2" }
nestrs = { path = "../nestrs", version = "0.5.2", optional = true }

# MCP SDK — stdio transport is the default (Claude Code, Cursor, VS Code).
# Streamable HTTP transport is gated behind the `http` feature for hosted use.
rmcp = { version = "3.1", default-features = false, features = [
    "server",
    "macros",
    "schemars",
    "transport-io",
] }
schemars = "1"
dashmap = "6"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
syn = { version = "2", features = ["full", "extra-traits", "parsing"] }
quote = "1"
proc-macro2 = "1"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
tempfile = "3"
toml = "0.8"
axum = { workspace = true }
# Cross-platform home-dir resolution for the `init`/`setup` wizard
# (e.g. `~/.cursor/mcp.json` on Unix, `%USERPROFILE%\.cursor\mcp.json` on Windows).
dirs = "5"

[dev-dependencies]
# Integration tests that spawn the binary need the same rmcp as the binary
# (so the test can speak the protocol to a child process).
rmcp = { version = "3.1", default-features = false, features = [
    "server",
    "client",
    "macros",
    "schemars",
    "transport-io",
] }
tokio = { version = "1", features = ["full", "process", "io-util", "macros", "rt-multi-thread"] }
# Live admin-port smoke test needs the `#[injectable]` / `#[module]`
# proc-macro attributes. The test itself is `#[cfg(feature = "admin")]`
# so the macro dep is unused when the feature is off — that's fine.
nestrs-macros = { path = "../nestrs-macros", version = "0.5.2" }
# `RouteRegistry::clear_for_tests` and friends — only used by the
# admin-port smoke test to make the route-registry state deterministic.
nestrs-core = { path = "../nestrs-core", version = "0.5.2", features = ["test-hooks"] }

[features]
default = ["stdio"]
stdio = []
http = ["rmcp/transport-streamable-http-server"]
admin = ["dep:nestrs", "nestrs/admin"]
