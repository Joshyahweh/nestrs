[package]
name = "nestrs-oauth2"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
description = "OAuth2 client (4 grant types incl. PKCE) + JWKS-backed resource server + social providers (Google/GitHub/Microsoft/Apple) + OAuth2Guard + full OAuth2 authorization server (issue Ed25519-signed JWTs) + bcrypt/argon2 password hashing (Wave 7.13) for nestrs."
keywords = ["oauth2", "oidc", "auth", "nest", "axum"]
categories = ["authentication", "api-bindings", "web-programming", "cryptography"]

[dependencies]
nestrs-core = { path = "../nestrs-core", version = "1.2.0" }
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum.workspace = true
tokio.workspace = true
async-trait = "0.1"
thiserror = "1"
tracing = "0.1"
base64 = "0.22"
rand = "0.8"
arc-swap = "1"
parking_lot = "0.12"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
ed25519-dalek = { version = "2", features = ["pem"], optional = true }
sha2 = { version = "0.10", optional = true }
pkcs8 = { version = "0.10", features = ["pem"], optional = true }
bcrypt = { version = "0.15", optional = true }
argon2 = { version = "0.5", optional = true }
nestrs-oauth2-macros = { path = "../nestrs-oauth2-macros", version = "1.2.0", optional = true }

[dev-dependencies]
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
ed25519-dalek = { version = "2", features = ["pem"] }
pkcs8 = { version = "0.10", features = ["pem"] }
josekit = "0.10"
sha2 = "0.10"
rand = "0.8"

[features]
default = []
## OAuth2 client: authorize URL + token exchange (4 grant types incl. PKCE)
client = []
## JWKS-backed resource server: JwksCache + JwtVerifier
resource-server = []
## Social provider wrappers (Google / GitHub / Microsoft / Apple)
social = []
## OAuth2Guard + install_oauth2_middleware + OAuth2Module (requires client +
## resource-server so the module can export something useful)
guard = ["client", "resource-server"]
## Full OAuth2 authorization server: /authorize (PKCE S256) + /token
## (authorization_code, refresh_token with rotation + reuse detection,
## client_credentials), RFC 7662 introspection, RFC 7009 revocation,
## RFC 8414 discovery, and a JWKS endpoint — issues Ed25519-signed JWTs
## verifiable by any `JwtVerifier` (incl. this crate's).
authorization-server = ["dep:ed25519-dalek", "dep:sha2", "dep:pkcs8"]
## Password-hashing helpers — Bcrypt backend (pure rust).
## Wave 7.13 (Tier 3.5).
password-bcrypt = ["dep:bcrypt"]
## Password-hashing helpers — Argon2id backend (pure rust).
## Wave 7.13 (Tier 3.5).
password-argon2 = ["dep:argon2"]
## Pulls in the `nestrs-oauth2-macros` proc-macro crate so users can
## write `#[derive(HashOnNew)]` without declaring a separate
## `nestrs-oauth2-macros` dep.
password-macros = ["dep:nestrs-oauth2-macros"]
## Password-hashing umbrella: Bcrypt + Argon2id backends, prefix
## auto-detection in `verify_any`, and the `HashOnNew` derive / `hash`
## field attribute via `nestrs_oauth2_macros`. Use this in user code.
password = ["password-bcrypt", "password-argon2", "password-macros"]
## All-in convenience feature for users who want everything
all = ["client", "resource-server", "social", "guard", "authorization-server", "password"]
