[package]
name = "nestrs-passport"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
description = "Passport-style AuthStrategy adapters for nestrs (NestJS @nestjs/passport analogue)."
keywords = ["passport", "jwt", "auth", "nest", "strategy"]
categories = ["authentication", "web-programming"]

[dependencies]
async-trait = "0.1"
axum.workspace = true
base64 = "0.22"
nestrs-core = { path = "../nestrs-core", version = "1.3.0" }
nestrs-security = { path = "../nestrs-security", version = "1.3.0", default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
