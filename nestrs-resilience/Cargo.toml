[package]
name = "nestrs-resilience"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
description = "Retry, timeout, circuit breaker, bulkhead, and fallback policies for nestrs — NestJS @nestjs/resilience parity."
keywords = ["resilience", "retry", "circuit-breaker", "nest", "axum"]
categories = ["asynchronous", "web-programming"]

[dependencies]
nestrs-core = { path = "../nestrs-core", version = "1.7.0" }
axum.workspace = true
tokio = { workspace = true, features = ["time", "sync"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tower = { version = "0.5", features = ["util"] }
rand = "0.8"
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "policy_overhead"
harness = false
