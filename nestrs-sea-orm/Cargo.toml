[package]
name = "nestrs-sea-orm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
description = "SeaORM adapter for nestrs — Repo, ambient transactions, and pluggable row authz."
keywords = ["orm", "sea-orm", "sql", "nest", "adapter"]
categories = ["database", "web-programming"]

[dependencies]
axum.workspace = true
nestrs-core = { path = "../nestrs-core", version = "1.4.0" }
sea-orm = { version = "1.1", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-sqlite", "with-json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
