[package]
name = "nestrs-security"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
description = "Security building blocks for nestrs — Bearer token parsing, AuthStrategyGuard, DemoXRoleMetadataGuard, helmet-style response-header middleware (Phase D surface), and the double-submit CSRF middleware (NestJS helmet + csurf parity)."
keywords = ["security", "csrf", "helmet", "auth", "axum"]
categories = ["api-bindings", "web-programming"]

[dependencies]
nestrs-core = { path = "../nestrs-core", version = "1.5.0" }
axum.workspace = true
tokio.workspace = true
async-trait = "0.1"
serde_json = "1"
tracing = "0.1"
tower-cookies = { version = "0.10", optional = true }
subtle = { version = "2.6", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[features]
default = []
## Double-submit CSRF middleware (`csrf_double_submit_middleware` +
## `CsrfProtectionConfig`). Pulls in `tower-cookies` (to read the
## `csrf_token` cookie) and `subtle` (constant-time token compare).
csrf = ["dep:tower-cookies", "dep:subtle"]
## Convenience: `csrf` plus the rest of the surface (currently the same as
## `csrf` — kept for symmetry with `nestrs-throttle`).
all = ["csrf"]
