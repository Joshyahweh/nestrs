[package]
name = "nestrs-ws"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "WebSocket extension crate for nestrs."
keywords = ["websocket", "axum", "nest", "tower", "async"]
categories = ["network-programming", "web-programming", "asynchronous"]

[dependencies]
async-trait = "0.1"
axum = { workspace = true, features = ["ws"] }
nestrs-core = { version = "1.4.0", path = "../nestrs-core" }
tokio = { workspace = true, features = ["sync", "time"] }
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tokio-tungstenite = "0.24"
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "macros", "time"] }
