[package]
name = "nestrs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "NestJS-like API framework for Rust on top of Axum and Tower."
keywords = ["axum", "tower", "nest", "di", "web"]
categories = ["web-programming", "asynchronous", "network-programming"]

[features]
default = []
microservices = ["dep:nestrs-microservices", "dep:nestrs-events"]
microservices-nats = ["microservices", "nestrs-microservices/nats", "dep:async-nats", "nestrs-health/nats"]
microservices-redis = ["microservices", "nestrs-microservices/redis", "dep:redis", "nestrs-health/redis"]
microservices-grpc = ["microservices", "nestrs-microservices/grpc"]
microservices-kafka = ["microservices", "nestrs-microservices/kafka"]
microservices-mqtt = ["microservices", "nestrs-microservices/mqtt"]
microservices-rabbitmq = ["microservices", "nestrs-microservices/rabbitmq"]
microservices-metrics = ["microservices", "nestrs-microservices/microservice-metrics"]
ws = ["dep:nestrs-ws"]
graphql = ["dep:nestrs-graphql"]
## Multi-transport extension: per-resolver ability resolution, ambient sqlx
## `TransactionSlot` lifetime, and CASL-style outbound masking on GraphQL
## responses. Pairs with `authz` (provides `Ability`) and `database-sqlx`
## (provides the `AnyPool` driver).
graphql-authz = ["graphql", "authz", "database-sqlx", "nestrs-graphql/graphql-authz"]
## Per-request batching loaders on the GraphQL transport: `GqlDataContext`
## gains a `DataLoaderRegistry` (installed into each request's data map by
## the hook path), and `nestrs::graphql` re-exports `DataLoader` / `Loader`.
## Pair with the `#[dataloader]` proc macro to define loaders.
graphql-dataloader = ["graphql-authz", "nestrs-graphql/dataloader"]
## Lightweight Apollo Federation gateway: stitches subgraph SDLs behind
## one Axum handler with `_service { sdl }` introspection and
## `_entities` cross-subgraph dispatch. Pulls in `graphql-authz` because
## the per-request `GqlHandlerHook` is the surface row-level predicates
## (Wave 3D) ride through to entity resolvers — without authz the hook
## is a no-op and entity resolvers see no ambient Ability.
graphql-federation-gateway = ["graphql-authz", "nestrs-graphql/federation-gateway"]
openapi = ["dep:nestrs-openapi"]
cache-redis = ["dep:redis"]
schedule = ["dep:tokio-cron-scheduler", "dep:linkme"]
queues = ["dep:linkme"]
queues-redis = ["queues", "dep:redis"]
## Hot-reload watcher for file-based `ConfigSource`s: rebuilds the
## `ConfigService` snapshot when any watched file changes (150 ms
## debounce). Pulls in the `notify` crate only when enabled.
config-hot-reload = ["dep:notify"]
database-sqlx = ["dep:sqlx", "dep:serde_qs"]
mongo = ["dep:nestrs-mongodb"]
# Enables DNS/SRV resolution (`mongodb+srv://`, Atlas-style seed lists). Pulls **`hickory-*`** (see upstream MongoDB driver advisories).
mongo-dns = ["mongo", "nestrs-mongodb/dns-resolver"]
http-client = ["dep:reqwest", "nestrs-health/http"]
# Disk-space readiness indicator (`nestrs::DiskSpaceIndicator`, unix only —
# backed by `statvfs` via `libc::statvfs`). The `libc` dep lives on
# `nestrs-health` (gated by its `disk` feature) so this crate doesn't need
# it directly.
health-disk = ["nestrs-health/disk"]
cookies = ["dep:tower-cookies"]
## Security building blocks: Bearer token parsing, `BearerToken` /
## `OptionalBearerToken` extractors, `AuthStrategyGuard`,
## `DemoXRoleMetadataGuard`, route-metadata helpers, and the helmet-style
## response-header middleware (`HelmetConfig` + `helmet_middleware`).
## Kept as a no-op feature flag for backward compat with downstream
## `#[cfg(feature = "security")]` code; the underlying `nestrs-security`
## crate is a non-optional dep so the symbols are always re-exported
## from `nestrs::security::*`.
security = []
## Double-submit CSRF middleware (`csrf_double_submit_middleware` +
## `CsrfProtectionConfig`) on top of `security` — pulls in `tower-cookies`
## and `subtle` via the underlying crate.
csrf = ["security", "cookies", "dep:subtle"]
session = ["cookies", "dep:tower-sessions"]
mvc = ["dep:minijinja"]
files = ["dep:tokio-util"]
otel = [
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
  "dep:tracing-opentelemetry",
  "dep:opentelemetry-appender-tracing",
]
## First-class authentication: `JwtService` (EdDSA via `jsonwebtoken`), `Argon2idPasswordHasher`,
## `Principal`/`OptionalPrincipal` extractors, `AuthnGuard` (with `#[roles(...)]` enforcement), and
## `AuthnModule::register(AuthnOptions)`.
authn = ["dep:jsonwebtoken", "dep:argon2", "dep:getrandom"]
## First-class authorization: CASL-style `Ability` / `AbilityBuilder`, `PoliciesGuard`,
## `#[check_policies(...)]` route metadata, and `PoliciesModule::register(PoliciesOptions)`.
## Pairs with `authn` so guards can read the verified `PrincipalIdentity`.
authz = []
## Row-level authorization enforcement: the pre-built predicates
## (`nestrs::predicates`), `Repository::find_many_authorized(FindManyParams)`,
## and mandatory application of the `Ability`'s row-level predicate by every
## `CrudService` method (create/read/update/delete/list — deny-closed when no
## `Ability` is in request scope). Custom predicate closures themselves only
## need `authz`; this flag gates the enforcement seam.
authz-row-level = ["authz", "database-sqlx"]
## Multi-transport extension: per-connection `Ability` resolution, ambient
## `TransactionSlot` lifetime, and CASL-style outbound masking on WebSocket
## frames. The new helpers live in the main `nestrs` crate
## (`nestrs::ws::{WsScope, current_ws_ability, current_ws_transaction,
## emit_masked}`) so `nestrs-ws` does not need to depend on `nestrs`
## (Cargo would reject the cycle). Users opt into masking by calling
## `nestrs::ws::emit_masked(&client, event, data, &ability)` instead of
## `client.emit(...)`.
ws-authz = ["ws", "authz", "database-sqlx"]
## First-class OAuth2: 4 grant types (incl. PKCE) via `OAuth2Client`, JWKS-
## backed `JwtVerifier` (resource server), social providers (Google/GitHub/
## Microsoft/Apple), `OAuth2Guard`, and `install_oauth2_middleware`. The
## underlying crate is `nestrs-oauth2`; the main crate re-exports its
## public types and provides `NestApplication::use_oauth2(OAuth2Options)`.
oauth2 = ["dep:nestrs-oauth2"]
## nestrs **as the IdP**: the full OAuth2 authorization server —
## `/authorize` (PKCE S256), `/token` (authorization_code + rotating
## refresh, client_credentials), RFC 7662 introspection, RFC 7009
## revocation, RFC 8414 discovery, JWKS — issuing Ed25519-signed JWTs
## any `JwtVerifier` (incl. this framework's) can check. Reachable as
## `nestrs::oauth2::authorization_server::*`.
oauth2-authorization-server = ["oauth2", "nestrs-oauth2/authorization-server"]
## Compound: OAuth2 + the `authn` `Principal` extractor so a route can
## use `Principal` to read either a JWT or an OAuth2 token identity.
authn-oauth2 = ["authn", "oauth2"]
## Enables a localhost-only HTTP admin port with `/__nestrs/{health,routes,providers,openapi.json}` endpoints. Consumed by `nestrs-mcp`'s live-runtime tools.
admin = ["dep:subtle"]
## Clears `nestrs-core` global registries in tests (`RouteRegistry`, `MetadataRegistry`). See `STABILITY.md`.
test-hooks = ["nestrs-core/test-hooks"]
## Route throttling (`#[throttle(n, "per")]` / `#[skip_throttle]`); provides
## `ThrottlerModule::register`, `ThrottlerGuard`, and the global middleware
## installed by `NestApplication::use_throttler`. Underlying crate is
## `nestrs-throttler`; the main crate re-exports its public types.
throttler = ["dep:nestrs-throttler"]
## Pulls in the Redis backend (`ThrottlerBackendKind::Redis` +
## `RedisThrottler`) on top of `throttler`. Same flag name as the crate-level
## `cache-redis` so feature surfaces stay symmetric.
throttler-redis = ["throttler", "nestrs-throttler/cache-redis"]

[dependencies]
axum = { workspace = true, features = ["multipart", "macros"] }
tokio.workspace = true
nestrs-core = { version = "1.0.0", path = "../nestrs-core" }
nestrs-macros = { version = "1.0.0", path = "../nestrs-macros" }
nestrs-microservices = { version = "1.0.0", path = "../nestrs-microservices", optional = true }
nestrs-events = { version = "1.0.0", path = "../nestrs-events", optional = true }
nestrs-ws = { version = "1.0.0", path = "../nestrs-ws", optional = true }
nestrs-graphql = { version = "1.0.0", path = "../nestrs-graphql", optional = true }
nestrs-openapi = { version = "1.0.0", path = "../nestrs-openapi", optional = true }
nestrs-security = { version = "1.0.0", path = "../nestrs-security", default-features = false }
nestrs-throttler = { version = "1.0.0", path = "../nestrs-throttler", optional = true, default-features = false }
nestrs-health = { version = "1.0.0", path = "../nestrs-health", default-features = false }
nestrs-mongodb = { version = "1.0.0", path = "../nestrs-mongodb", optional = true, default-features = false }
nestrs-drizzle = { version = "1.0.0", path = "../nestrs-drizzle", optional = true, default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
validator = { version = "0.20", features = ["derive"] }
# Explicitly pin validator_derive to 0.20 to match validator.
# Without this, transitive deps (e.g. async-graphql) may pull
# a different validator_derive version causing "JsonValue is not
# an iterator" from the blanket impl on &BTreeMap<K, V>.
validator_derive = "0.20"
tower = { version = "0.5", features = ["limit", "load-shed"] }
tower-http = { version = "0.6", features = ["cors", "catch-panic", "set-header", "limit", "request-id", "compression-gzip", "decompression-gzip", "normalize-path", "fs"] }
async-trait = "0.1"
metrics = "0.24"
# Recorder + render only; we expose `/metrics` via Axum (no built-in hyper listener / push gateway).
metrics-exporter-prometheus = { version = "0.18", default-features = false }
tracing = "=0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
dotenvy = "0.15.7"
envy = "0.4.2"
redis = { version = "0.29", features = ["tokio-comp"], optional = true }
async-nats = { version = "0.47", optional = true }
tokio-cron-scheduler = { version = "0.15.1", optional = true }
linkme = { version = "0.3", optional = true }
## File-format parsers for `ConfigSource::File` (TOML + YAML); `serde_json`
## is already a direct dep so JSON parsing needs no extra entry. These are
## unconditional — every `FileFormat::*` variant must be wired up so the
## `ConfigOptions` builder typechecks.
toml = "0.8"
serde_yaml = "0.9"
## Filesystem watcher for `ConfigWatcher` under the `config-hot-reload`
## feature flag. Pulled in only when the flag is on so apps that don't
## need hot-reload pay no compile cost.
notify = { version = "6.1", optional = true }
opentelemetry = { version = "0.32.0", features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["trace", "metrics", "logs", "grpc-tonic"], optional = true }
tracing-opentelemetry = { version = "0.33.0", default-features = false, optional = true }
# Bridges the `tracing` facade to the OTLP logger provider: with
# `OpenTelemetryConfig::logs()`, every tracing event additionally becomes an
# OpenTelemetry log record exported over the same OTLP pipeline as traces.
opentelemetry-appender-tracing = { version = "0.32", optional = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "any", "macros", "postgres", "sqlite"], optional = true }
## Query-string parsing for the `#[nestrs::crud]` proc-macro's list endpoint
## (`?filter[field]=x&sort=field:DIR&page=2&per_page=10`). Bracketed-key syntax
## is the standard convention from `@nestjsx/crud`; `axum::extract::Query`
## only handles flat `?key=value&key2=value2`. The `__CrudQueryAdapter` in
## `nestrs::crud_macro` wraps it behind the same `BadRequestException` /
## `UnprocessableEntityException` contract as `ValidatedQuery`.
serde_qs = { version = "0.13", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tower-cookies = { version = "0.10", optional = true }
subtle = { version = "2.6", optional = true }
tower-sessions = { version = "0.10", default-features = false, features = ["memory-store"], optional = true }
minijinja = { version = "2", optional = true, default-features = false, features = ["serde"] }
tokio-util = { version = "0.7", features = ["io"], optional = true }
jsonwebtoken = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true, features = ["rand"] }
getrandom = { version = "0.2", optional = true }
nestrs-oauth2 = { version = "1.0.0", path = "../nestrs-oauth2", optional = true, default-features = false, features = ["client", "resource-server", "guard"] }

[dev-dependencies]
async-graphql = "=7.0.17"
flate2 = "1"
tower = { version = "0.5", features = ["util"] }
serial_test = "3"
criterion = { version = "0.5", features = ["async_tokio"] }
futures-util = "0.3"
# Test-only tokio features (paused clock for timeout tests). Merges with the
# workspace tokio via feature unification; never affects downstream builds.
tokio = { workspace = true, features = ["test-util"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "std", "rand_core"] }
ed25519 = { version = "2", features = ["pkcs8", "pem"] }
rand = "0.8"
pkcs8 = { version = "0.10", features = ["pem"] }
chrono = "0.4"
http-body-util = "0.1"
josekit = "0.10"
jsonwebtoken = { workspace = true }
url = "2"
wiremock = "0.6"
# In-memory OTel metric/log exporters for offline bridge tests
# (`tests/otel_metrics.rs` + in-module tests). Feature-unifies with the
# optional main dependency whenever the `otel` feature is enabled.
opentelemetry_sdk = { version = "0.32.1", features = ["testing"] }

[[bench]]
name = "router_hot_path"
harness = false

[[bench]]
name = "router_middleware_stack"
harness = false

[[bench]]
name = "di_resolution"
harness = false

[[bench]]
name = "json_validation_hot_path"
harness = false

[[test]]
name = "integration_matrix"
path = "tests/integration_matrix.rs"
required-features = ["openapi", "csrf", "test-hooks"]
